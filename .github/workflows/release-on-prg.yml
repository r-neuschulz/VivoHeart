name: Release on .prg or .iq

on:
  push:
    branches: [master, main]
    paths:
      - 'VivoHeart.prg'
      - 'VivoHeart.iq'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get next version
        env:
          GH_TOKEN: ${{ github.token }}
        id: version
        run: |
          LATEST=$(gh release list --limit 1 --exclude-drafts --json tagName -q '.[0].tagName')
          if [ -z "$LATEST" ]; then
            echo "tag=v1.1" >> $GITHUB_OUTPUT
          else
            # Parse vMAJOR.MINOR, increment minor
            VER="${LATEST#v}"
            MAJOR="${VER%%.*}"
            MINOR="${VER#*.}"
            MINOR="${MINOR%%.*}"
            NEW_MINOR=$((MINOR + 1))
            echo "tag=v${MAJOR}.${NEW_MINOR}" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_UPDATE_URL: https://apps.garmin.com/developer/b6997a35-c790-4fdb-b50e-0e4ff90c8d12/apps/78734b9c-f2e9-4ac0-a117-55f2591900d2/update
        id: notes
        run: |
          PREV_TAG=$(gh release list --limit 1 --exclude-drafts --json tagName -q '.[0].tagName')
          if [ -z "$PREV_TAG" ]; then
            BODY=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            BODY=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --reverse)
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "Connect IQ Store: [Update here](${STORE_UPDATE_URL}) (upload VivoHeart.iq)" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            VivoHeart.prg
            VivoHeart.iq
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
